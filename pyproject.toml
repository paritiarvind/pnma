[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pnma"
version = "0.1.0"
description = "Personal Network Monitoring Agent: network, host and identity posture that is honest about what it cannot see"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
]

[project.optional-dependencies]
capture = ["scapy>=2.5"]
dev = ["pytest>=8"]

[project.scripts]
pnma = "pnma.__main__:main"

[tool.setuptools.packages.find]
include = ["pnma*"]

[tool.setuptools.package-data]
pnma = ["web/*", "data/*.csv"]
